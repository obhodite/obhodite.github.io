<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обход здесь</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: "JetBrains Mono", Consolas, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            margin: 0 0 32px;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        .qr {
            display: block;
            width: min(280px, 80vw);
            height: auto;
            margin: 0 auto 32px;
            background: #fff;
        }

        .download {
            display: inline-block;
            padding: 12px 22px;
            border: 1px solid #fff;
            color: #fff;
            text-decoration: none;
            font-family: inherit;
            font-size: 15px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .download:hover {
            background: #fff;
            color: #000;
        }

        .download:active {
            opacity: 0.75;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>обход здесь</h1>

        <img class="qr" src="qr.png" alt="QR-код">

        <a class="download" href="config.vpn" download>
            Скачать
        </a>
    </main>
</body>
</html>
